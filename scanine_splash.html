<!doctype html>
<!--
  scanine splash: standalone reference.
  Plays once, full screen, with no controls, then reports that it has finished in three ways:
    1. a "scanine:done" event on window
    2. window.onScanineSplashDone(), if you have defined it
    3. ScanineSplashChannel.postMessage("done"), if the page runs inside a webview that registered that channel
  Add ?t=2.6 to the address to freeze on a moment (in seconds) while inspecting.
  The tagline uses Urbanist from Google Fonts; bundle the font yourself if the page must work offline.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>scanine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500&display=swap">
<style>
:root {
  --bg: #EEF1F6; --bg-hi: #F9FAFD; --bg-lo: #E6EAF2;   /* cloud background: brighter in the middle, deeper at the corners */
  --ink: #1F3864; --ink-2: #7888AB; --ink-3: #C2CBDC;   /* navy, and the two paler tones that lead each stroke */
  --scan: #DCE1EB; --shine: #8E99B0;                    /* the scan line and the wake behind it */
  --muted-ink: #5A6A8C;                                 /* tagline */
}
html, body { height: 100%; margin: 0; }
body {
  overflow: hidden;
  background: var(--bg) radial-gradient(ellipse 72% 72% at 50% 49%, var(--bg-hi) 0%, var(--bg) 50%, var(--bg-lo) 100%);
}
svg { display: block; width: 100vw; height: 100vh; height: 100dvh; }
.e1 { stroke: var(--ink-3); }
.e2 { stroke: var(--ink-2); }
.e3 { stroke: var(--ink); }
.ls { fill: none; stroke-width: 8; }
.dot { fill: var(--ink); }
.shine { --ink: var(--shine); }
.core { --ink: var(--scan); }
.s0 { stop-color: #fff; stop-opacity: 0; } .s1 { stop-color: #fff; stop-opacity: 1; }
.tag { font-family: "Urbanist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 17.85px; letter-spacing: .03em; fill: var(--muted-ink); }
.tag .sep { fill-opacity: .55; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid meet" role="img" aria-label="scanine. scan, screen, care.">
  <defs>
    <linearGradient id="shineGrad"><stop offset="0" class="s1"/><stop offset="1" class="s0"/></linearGradient>
    <mask id="shineMask" maskUnits="userSpaceOnUse" x="0" y="0" width="390" height="844"><rect id="shineBar" y="0" height="844" width="84" fill="url(#shineGrad)"/></mask>
    <linearGradient id="coreGrad"><stop offset="0" class="s0"/><stop offset=".35" class="s1"/><stop offset=".65" class="s1"/><stop offset="1" class="s0"/></linearGradient>
    <mask id="coreMask" maskUnits="userSpaceOnUse" x="0" y="0" width="390" height="844"><rect id="coreBar" y="0" height="844" width="7" fill="url(#coreGrad)"/></mask>
    <clipPath id="sClip"><rect id="sClipR" y="-120" height="240" width="600"/></clipPath>
  </defs>
  <g id="scene">
    <g id="logo"></g>
    <!-- a grey copy of the lettering, seen only in the soft wake behind the scan line -->
    <g mask="url(#shineMask)"><use href="#logo" class="shine"/></g>
    <!-- the scan line itself: a light copy of the lettering seen through a narrow slit, so it only ever shows inside the letters -->
    <g mask="url(#coreMask)"><use href="#logo" class="core"/></g>
    <g id="tag" opacity="0"><text class="tag" x="195" y="481" text-anchor="middle">scan<tspan class="sep">&#160;+&#160;</tspan>screen<tspan class="sep">&#160;+&#160;</tspan>care</text></g>
  </g>
</svg>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';

  // ----- the clock, in real seconds -----
  var PACE = .7;                 // the motion was timed at full speed, then slowed to 0.7x
  var MOTION = 2.45;             // length of the motion on its own clock
  var HOLD_A = MOTION / PACE;    // 3.5 s: the last motion lands
  var HOLD_B = HOLD_A + .5;      // 4.0 s: half a second of stillness is over
  var T = HOLD_B + .35;          // 4.35 s: the fade to the next screen is complete

  // ----- layout -----
  var BASE = 440, CX = 195;                                    // baseline and centre line on the 390 x 844 stage
  var X = 38, WT = 8, R = (X - WT) / 2, CY = -X / 2;           // x-height, stroke weight, bowl radius, middle of the letters

  // ----- motion clock (before PACE is applied) -----
  var START = .25, STAG = .075, DUR = .42, LAG = .065;         // first stroke, delay per letter, stroke length, delay per echo
  var SWEEP_A = 1.2, SWEEP_B = 2.06, SLIT = 7;                 // when the scan line sweeps, and its own width

  var $ = function (id) { return document.getElementById(id); };
  var clamp = function (x) { return Math.min(1, Math.max(0, x)); };
  var seg = function (x, a, b) { return clamp((x - a) / (b - a)); };
  var lerp = function (a, b, p) { return a + (b - a) * p; };
  var outCubic = function (x) { return 1 - Math.pow(1 - x, 3); };
  var inOutCubic = function (x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  var inOutSine = function (x) { return -(Math.cos(Math.PI * x) - 1) / 2; };
  // a cubic-bezier easing, solved by bisection
  var bezier = function (x1, y1, x2, y2) {
    return function (x) {
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      var lo = 0, hi = 1, t = x;
      for (var i = 0; i < 22; i++) {
        t = (lo + hi) / 2;
        if (3 * x1 * t * (1 - t) * (1 - t) + 3 * x2 * t * t * (1 - t) + t * t * t < x) lo = t; else hi = t;
      }
      return 3 * y1 * t * (1 - t) * (1 - t) + 3 * y2 * t * t * (1 - t) + t * t * t;
    };
  };
  var settle = bezier(.3, 0, .1, 1);   // leaves gently, moves decisively, takes its time landing
  var draw = function (x) { return .4 * inOutCubic(x) + .6 * outCubic(x); };          // quick start, soft landing
  var softBack = function (x) { var u = x - 1; return 1 + 2 * u * u * u + u * u; };   // lands a touch past, then settles
  var n = function (v) { return (+v).toFixed(2); };
  var rad = function (deg) { return deg * Math.PI / 180; };
  var el = function (name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };
  var each = function (list, fn) { Array.prototype.forEach.call(list, fn); };

  // Builds the lowercase wordmark into a group. Each letter gets its own group and a record of its left edge.
  function buildLogo(g) {
    var strokes = [], dot = null, x = 0, boxes = [], parent = null;

    function stroke(d, t0, dur) {
      var els = ['e1', 'e2', 'e3'].map(function (e) { return el('path', { d: d, 'class': 'ls ' + e }, parent); });
      var len = els[0].getTotalLength();
      els.forEach(function (p) { p.setAttribute('stroke-dasharray', n(len) + ' ' + n(len + 4)); });
      strokes.push({ els: els, len: len, t0: t0, dur: dur });
    }
    function stem(sx, t0) { stroke('M' + n(sx) + ' 0 V' + (-X), t0, DUR * .8); }
    function nLetter(t0) {
      var sx = x + WT / 2, ra = 10.5, yc = -X + WT / 2 + ra;
      stem(sx, t0);
      stroke('M' + n(sx) + ' ' + n(yc) + ' A' + ra + ' ' + ra + ' 0 0 1 ' + n(sx + 2 * ra) + ' ' + n(yc) + ' V0', t0 + .08, DUR);
      return [2 * ra + WT, 6];
    }
    // each letter returns [its width, the gap after it]
    var letters = [
      // s: two stacked arcs, drawn top to bottom
      function (t0) {
        var rx = 10.5, ry = (X - WT) / 4, cx = x + WT / 2 + rx, cu = -X + WT / 2 + ry, cl = -WT / 2 - ry;
        stroke('M' + n(cx + rx * Math.cos(rad(28))) + ' ' + n(cu - ry * Math.sin(rad(28))) +
          ' A' + rx + ' ' + ry + ' 0 1 0 ' + n(cx) + ' ' + n(cu + ry) +
          ' A' + rx + ' ' + ry + ' 0 1 1 ' + n(cx + rx * Math.cos(rad(208))) + ' ' + n(cl - ry * Math.sin(rad(208))), t0, DUR * 1.1);
        return [2 * rx + WT, 4];
      },
      // c
      function (t0) {
        var cx = x + WT / 2 + R, a = rad(42);
        stroke('M' + n(cx + R * Math.cos(a)) + ' ' + n(CY - R * Math.sin(a)) + ' A' + R + ' ' + R + ' 0 1 0 ' +
          n(cx + R * Math.cos(a)) + ' ' + n(CY + R * Math.sin(a)), t0, DUR);
        return [WT / 2 + R + R * Math.cos(a) + 2.7, 3];
      },
      // a: the stem rises, then the bowl swings round from it
      function (t0) {
        var cx = x + WT / 2 + R;
        stroke('M' + n(cx + R) + ' ' + CY + ' A' + R + ' ' + R + ' 0 1 0 ' + n(cx - R) + ' ' + CY +
          ' A' + R + ' ' + R + ' 0 1 0 ' + n(cx + R) + ' ' + CY, t0 + .08, DUR);
        stem(cx + R, t0);
        return [2 * R + WT, 6];
      },
      nLetter,
      // i: stem, then the dot pops
      function (t0) {
        stem(x + WT / 2, t0);
        dot = { el: el('circle', { r: 5, 'class': 'dot' }, parent), cx: x + WT / 2, cy: -X - 9, t0: t0 + .22, dur: .22 };
        return [WT, 6];
      },
      nLetter,
      // e: the bar, then all the way round
      function (t0) {
        var cx = x + WT / 2 + R, a = rad(40);
        stroke('M' + n(cx - R) + ' ' + CY + ' H' + n(cx + R) + ' A' + R + ' ' + R + ' 0 1 0 ' +
          n(cx + R * Math.cos(a)) + ' ' + n(CY + R * Math.sin(a)), t0, DUR * 1.1);
        return [2 * R + WT, 0];
      }
    ];
    letters.forEach(function (make, i) {
      parent = el('g', {}, g);
      var m = make(i === 0 ? -9 : START + (i - 1) * STAG);   // the s is not part of the opening draw
      boxes.push({ g: parent, x0: x });
      x += m[0] + m[1];
    });

    function set(time) {
      strokes.forEach(function (s) {
        var solid = draw(seg(time, s.t0 + 2 * LAG, s.t0 + 2 * LAG + s.dur));
        s.els.forEach(function (p, j) {
          var prog = j === 2 ? solid : draw(seg(time, s.t0 + j * LAG, s.t0 + j * LAG + s.dur));
          p.setAttribute('visibility', prog <= .001 || (j < 2 && solid >= 1) ? 'hidden' : 'visible');
          p.setAttribute('stroke-dashoffset', n(s.len * (1 - prog)));
        });
      });
      var sc = softBack(seg(time, dot.t0, dot.t0 + dot.dur));
      dot.el.setAttribute('transform', 'translate(' + n(dot.cx) + ' ' + n(dot.cy) + ') scale(' + (time < dot.t0 ? 0 : sc).toFixed(4) + ')');
    }
    return { width: x, set: set, boxes: boxes };
  }

  var logoG = $('logo');
  var logo = buildLogo(logoG), boxes = logo.boxes;
  // WX is where the finished word starts. While "canine" stands alone it sits SHIFT to the left of that,
  // so it is centred by itself; it glides into its finished place as the s is printed.
  var WX = CX - logo.width / 2, SHIFT = boxes[1].x0 / 2;
  var X_R = WX - SHIFT + logo.width + 4, X_L = WX - 8;             // the line runs from the right edge of the e to the left edge of the s
  boxes[0].g.setAttribute('clip-path', 'url(#sClip)');             // the s shows only where the line has already been

  // time is in real seconds; m is the same moment on the motion's own clock
  function render(time) {
    var m = Math.min(time, HOLD_A) * PACE;
    logo.set(m);
    // The scan line enters at the e, sweeps right to left across "canine", and carries on to print the s.
    var sweep = settle(seg(m, SWEEP_A, SWEEP_B)), vx = lerp(X_R, X_L, sweep);
    var on = seg(m, SWEEP_A, SWEEP_A + .06) * (1 - seg(m, SWEEP_B - .08, SWEEP_B));
    // the word glides into its finished place while the s is being printed
    var lx = WX - SHIFT * (1 - settle(seg(m, 1.68, 2.12)));
    logoG.setAttribute('transform', 'translate(' + n(lx) + ' ' + BASE + ')');
    $('sClipR').setAttribute('x', n(vx - lx));
    $('coreBar').setAttribute('x', n(vx - 1)); $('coreBar').setAttribute('opacity', n(on));
    $('shineBar').setAttribute('x', n(vx + SLIT - 2)); $('shineBar').setAttribute('opacity', n(.85 * on));

    // the tagline fades in as one line, rising a few pixels into place
    var ta = outCubic(seg(m, 2.1, 2.45)), tag = $('tag');
    tag.setAttribute('opacity', n(ta));
    tag.setAttribute('transform', 'translate(0 ' + n((1 - ta) * 6) + ')');

    // after the half-second hold, everything fades away so the next screen can take over
    $('scene').setAttribute('opacity', n(1 - inOutSine(seg(time, HOLD_B, T))));
  }

  function done() {
    window.dispatchEvent(new CustomEvent('scanine:done'));
    if (typeof window.onScanineSplashDone === 'function') window.onScanineSplashDone();
    if (window.ScanineSplashChannel && window.ScanineSplashChannel.postMessage) window.ScanineSplashChannel.postMessage('done');
  }

  var frozen = /[?&]t=([\d.]+)/.exec(location.search);
  if (frozen) { render(+frozen[1]); return; }

  // with reduced motion the wordmark simply appears finished, holds, and fades
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var from = reduce ? HOLD_A : 0, t0 = null;
  function frame(now) {
    if (t0 === null) t0 = now;
    var t = Math.min(T, from + (now - t0) / 1000);
    render(t);
    if (t < T) requestAnimationFrame(frame); else done();
  }
  render(from);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
