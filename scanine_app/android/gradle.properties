org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# tflite_flutter 0.11.0 compiles its Java at 1.8 while Kotlin follows the
# JDK (21), and Gradle refuses to mix targets in one module. On Android the
# distinction is moot -- D8 desugars everything to DEX regardless -- so the
# check is disabled rather than patching a third-party plugin's build file.
kotlin.jvm.target.validation.mode=IGNORE
